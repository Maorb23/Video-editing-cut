[build]
builder = "NIXPACKS"
buildCommand = "pip install -e '.[service,redis,s3]'"

[deploy]
startCommand = "uvicorn service.app:create_app --factory --host 0.0.0.0 --port $PORT"
preDeployCommand = "video-edit-migrate"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
