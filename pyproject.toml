[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-editing-skill"
version = "0.1.0"
description = "Deterministic typed edit plans and Shotcut-compatible MLT projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "video-editing-skill contributors" }]
dependencies = []

[project.optional-dependencies]
service = [
    "fastapi>=0.116,<1",
    "psycopg[binary]>=3.2,<4",
    "django>=5.2,<6",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.35,<1",
]
redis = ["redis>=5,<7"]
s3 = ["boto3>=1.40,<2"]
browser-tests = ["playwright==1.55.0"]
dereverb = ["deepfilternet==0.5.6"]

[project.scripts]
video-edit-check = "video_editing.cli.check_environment:main"
video-edit-probe = "video_editing.cli.probe_media:main"
video-edit-validate = "video_editing.cli.validate_edit_plan:main"
video-edit-compile = "video_editing.cli.compile_project:main"
video-edit-render = "video_editing.cli.render_project:main"
video-edit-inspect = "video_editing.cli.inspect_video:main"
video-edit-viewer = "video_editing.cli.video_viewer:main"
video-edit-run = "video_editing.cli.run_pipeline:main"
video-edit-api = "service.app:main"
video-edit-worker = "service.worker:main"
video-edit-migrate = "service.migrate:main"

[tool.setuptools.packages.find]
include = ["video_editing*", "service*"]

[tool.setuptools.package-data]
service = ["migrations/*.sql", "web/*"]
